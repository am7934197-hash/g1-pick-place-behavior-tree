    #   - [-1.5382, 0.61]     # right_arm_joint7
    #   - [0, 100]             # right_arm_gripper
    #   - [0.0, 1.45]         # left_arm_joint1
    #   - [-1.6081, -0.27]    # left_arm_joint2
    #   - [-0.77, 0.74]       # left_arm_joint3
    #   - [-2.38, -1.248]     # left_arm_joint4
    #   - [-1.16, 0.81]       # left_arm_joint5
    #   - [-0.64, 0.7354]     # left_arm_joint6
    #   - [-1.26, 1.5382]     # left_arm_joint7
    #   - [0, 100]             # left_arm_gripper
    #   - [0.0, 0.9374]       # leg_joint1
    #   - [0.0, 2.5847]       # leg_joint2
    #   - [0.0, 2.3262]       # leg_joint3
