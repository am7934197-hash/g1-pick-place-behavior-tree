# The robot is assumed to already be at chassis point pick (map origin).
# Before point-A VLA, the tree restores the clean_ready_224 task-0 median pose
# from vla_config.yaml.
infer_server:
  url: "http://127.0.0.1:8006"
  # Covers a complete VLA episode, not a single HTTP read.
  timeout_seconds: 3600

navigation:
  points_file: /home/galbot/project_yuqiz/g1_move/slam/nav_points.json
  pick: pick
  place: place
  timeout_seconds: 60
  retries: 3

point_a:
  profile: "model_at_a"
  # Must exactly match the instruction used when training model_at_a.
  instruction: "Left arm pick up A. Right arm pick up A."
  max_steps: 500

point_b:
  profile: "model_at_b"
  # Required: must exactly match the instruction used when training model_at_b.
  instruction: "Left arm places part A in the lower-left corner of the sorting box and right arm places part A in the lower-left corner of the sorting box."
  max_steps: 800

# Place 成功后，行为树会自动：
#   1. 用地图导航回到 pick（原点）；
#   2. 恢复 vla_config.yaml 中 robot.init_joint_positions 的初始姿态。
# 头/腕保持工作模式；新 pick 与旧 place 均直接 letterbox 到 224。
